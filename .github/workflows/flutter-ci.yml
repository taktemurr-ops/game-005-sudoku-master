name: Flutter quality checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  analyze-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze Dart source
        run: flutter analyze
      - name: Run unit and widget tests
        run: flutter test
