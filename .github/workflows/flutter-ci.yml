name: Sudoku Flutter quality and Android debug
on:
  push:
    branches: [main]
  pull_request:
jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Flutter Android and iOS shells
        run: flutter create --platforms=android,ios --project-name game_005_sudoku_master .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze all source files
        run: flutter analyze --fatal-infos
      - name: Execute unit, widget and persistence tests
        run: flutter test --reporter expanded
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Attach tested APK
        uses: actions/upload-artifact@v4
        with:
          name: game-005-sudoku-master-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
